name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
defaults:
  run:
    shell: bash
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify sources and build standalone game
        run: |
          mkdir -p artifacts
          python3 -m unittest discover -s tests -p 'test_*.py'
          npm run verify 2>&1 | tee artifacts/verify.txt
          npm run pack:all 2>&1 | tee artifacts/pack.txt
      - name: Validate isolated SDK installation and strict TypeScript consumption
        run: |
          npm install --global typescript@5.9.3
          node tools/verify-packages.mjs --types 2>&1 | tee artifacts/package-install.txt
      - name: Install browser test tools
        run: |
          python3 -m venv "$RUNNER_TEMP/ski-playwright"
          "$RUNNER_TEMP/ski-playwright/bin/pip" install playwright==1.57.0
          "$RUNNER_TEMP/ski-playwright/bin/python" -m playwright install --with-deps chromium
      - name: Validate desktop, touch, cups, records and replay workflows
        run: |
          PY="$RUNNER_TEMP/ski-playwright/bin/python"
          CHROMIUM="$($PY -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          export CHROMIUM
          "$PY" tests/browser_full.py 2>&1 | tee artifacts/browser-tests.txt
          "$PY" tests/browser_features.py 2>&1 | tee artifacts/browser-features.txt
      - name: Require actual WebGPU execution and device-loss recovery
        run: |
          PY="$RUNNER_TEMP/ski-playwright/bin/python"
          CHROMIUM="$($PY -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          export CHROMIUM
          "$PY" tests/browser_gpu.py --require-webgpu 2>&1 | tee artifacts/browser-webgpu.txt
      - name: Write evidence and build downloadable release archives
        run: |
          node tools/write-validation.mjs
          python3 tools/package-release.py
      - name: Stage Pages site
        run: |
          mkdir -p _site/downloads
          cp -a dist/. _site/
          touch _site/.nojekyll
          cp SkiJumpWeb.html _site/SkiJumpWeb.html
          cp release/* _site/downloads/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ski-jump-web-release
          if-no-files-found: error
          path: |
            release/
            artifacts/browser-*
            artifacts/verify.txt
            artifacts/package-install.txt
            artifacts/release.json
            artifacts/screenshots/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published game, source, SDK archives and checksums
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python3 tools/verify-pages.py "$PAGE_URL" "$EXPECTED_COMMIT"
          echo "Published and checksum-verified game: ${PAGE_URL}" >> "$GITHUB_STEP_SUMMARY"
