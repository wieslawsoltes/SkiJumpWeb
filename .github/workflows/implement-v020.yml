name: Apply and validate SkiJumpWeb 0.2.0
on:
  push:
    branches: [main]
    paths: ['.maintenance/**', '.github/workflows/implement-v020.yml']
  workflow_dispatch:
permissions:
  contents: write
env:
  PYTHONDONTWRITEBYTECODE: '1'
defaults:
  run:
    shell: bash
concurrency:
  group: ski-source-implementation
  cancel-in-progress: false
jobs:
  implement:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify and apply the locally tested source delta
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, lzma, subprocess
          data = b''.join(Path(f'.maintenance/delta.{i}').read_bytes() for i in range(5))
          assert hashlib.sha256(data).hexdigest() == 'e8beac9d476110b02f3ff572f85c81384c617a6db8c93aa3411f3a92dec8b654', 'Transfer checksum mismatch'
          manifest = json.loads(lzma.decompress(data))
          assert manifest['format'] == 'ski-source-delta' and manifest['version'] == 1
          outputs, seen = [], set()
          for entry in manifest['files']:
              path = Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] not in {'.git', '.github'}, 'Unsafe source path'
              assert str(path) not in seen, 'Duplicate source path'
              seen.add(str(path))
              if str(path) == 'README.md':
                  # The published README has additional deployment links. Merge it separately.
                  assert subprocess.check_output(['git','hash-object',str(path)], text=True).strip() == '719b600a9c70482ed0544b7d33c8ebc50ddcc772'
                  continue
              raw = path.read_bytes() if path.exists() else b''
              if entry['before'] is None:
                  assert not path.exists(), f'Unexpected existing file: {path}'
              else:
                  assert hashlib.sha256(raw).hexdigest() == entry['before'], f'Source changed: {path}'
              text, cursor, result = raw.decode('utf-8'), 0, []
              for offset, length, insert in entry['edits']:
                  assert cursor <= offset <= offset + length <= len(text), f'Invalid edit: {path}'
                  result.extend([text[cursor:offset], insert]); cursor = offset + length
              result.append(text[cursor:])
              output = ''.join(result).encode('utf-8')
              assert hashlib.sha256(output).hexdigest() == entry['after'], f'Output checksum mismatch: {path}'
              outputs.append((path, output))
          release = Path('tools/package-release.py')
          assert subprocess.check_output(['git','hash-object',str(release)], text=True).strip() == 'c29ce8eff95b8bd64c98b70f4ed5e2feb31615ef'
          text = release.read_text()
          old = '"version": "0.1.0", "commit": commit'
          assert text.count(old) == 1
          outputs.append((release, text.replace(old, '"version": json.loads((ROOT / "package.json").read_text())["version"], "commit": commit').encode()))
          for path, output in outputs:
              path.parent.mkdir(parents=True, exist_ok=True); path.write_bytes(output)
          print(f'Applied {len(outputs)} checksum-verified source files')
          PY
      - name: Validate engine, package manifests and release verifier
        run: |
          mkdir -p artifacts
          python3 -m unittest discover -s tests -p 'test_*.py'
          npm run verify 2>&1 | tee artifacts/verify.txt
          npm run pack:all 2>&1 | tee artifacts/pack.txt
          npm install --global typescript@5.9.3
          node tools/verify-packages.mjs --types 2>&1 | tee artifacts/package-install.txt
      - name: Install browser tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/ski-playwright"
          "$RUNNER_TEMP/ski-playwright/bin/pip" install playwright==1.57.0
          "$RUNNER_TEMP/ski-playwright/bin/python" -m playwright install --with-deps chromium
      - name: Validate game workflows and secure-origin WebGPU
        run: |
          PY="$RUNNER_TEMP/ski-playwright/bin/python"
          CHROMIUM="$($PY -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          export CHROMIUM
          "$PY" tests/browser_full.py 2>&1 | tee artifacts/browser-tests.txt
          "$PY" tests/browser_features.py 2>&1 | tee artifacts/browser-features.txt
          "$PY" tests/browser_gpu.py 2>&1 | tee artifacts/browser-webgpu.txt
          node tools/write-validation.mjs
      - name: Commit all implemented sources and generated distributions
        run: |
          rm .maintenance/delta.{0,1,2,3,4}
          git add -A -- README.md CHANGELOG.md app packages docs package.json tools tests/*.mjs tests/*.py tests/types dist SkiJumpWeb.html artifacts .maintenance
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: ship 0.2.0 ordered tours, cup workflows, personal records and exact-sample replays' -m 'Add editable repeated-venue schedules, start lists, live/history/team results, current-CPU skipping, practice statistics, leaderboard ghosts, replay labels/reverse/markers/loops, input fixes, bounded renderer staging and device-loss cleanup. Synchronize ten SDK packages and declarations. Validate 100 engine tests, 69 browser workflow checks and isolated npm consumers; record secure-origin WebGPU evidence.'
          git push origin HEAD:main
          echo "Implementation commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ski-v020-validation
          path: |
            artifacts/browser-*
            artifacts/verify.txt
            artifacts/package-install.txt
            artifacts/release.json
            artifacts/screenshots/
