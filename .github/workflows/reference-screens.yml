name: Observe original demo screens
on:
  push:
    branches: [research/dsj210-fidelity]
    paths: [.github/workflows/reference-screens.yml]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq dosbox xvfb xdotool python3-pil
      - name: Observe original menu behavior without copying executable data into the project
        shell: bash
        env:
          DISPLAY: ':99'
          SDL_AUDIODRIVER: dummy
        run: |
          mkdir -p "$RUNNER_TEMP/dsj" "$RUNNER_TEMP/reference-screens"
          curl --fail --silent --show-error https://www.mediamond.fi/dsj2/downloads/dsj210.zip -o "$RUNNER_TEMP/dsj.zip"
          echo "c58c4484c911e1a91b1bc62710a6a1ddc911defbe77a06c72ebec51f3c78c431  $RUNNER_TEMP/dsj.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/dsj.zip" -d "$RUNNER_TEMP/dsj"
          Xvfb :99 -screen 0 800x600x24 &
          sleep 2
          printf '[sdl]\nfullscreen=false\noutput=surface\nautolock=false\n[render]\nframeskip=0\naspect=false\nscaler=normal2x\n[cpu]\ncycles=fixed 30000\n' > "$RUNNER_TEMP/reference.conf"
          dosbox -conf "$RUNNER_TEMP/reference.conf" -c "mount c $RUNNER_TEMP/dsj" -c 'c:' -c 'dsj.exe' > "$RUNNER_TEMP/dosbox.log" 2>&1 &
          sleep 8
          click() { xdotool mousemove "$1" "$2"; sleep .3; xdotool mousedown 1; sleep .3; xdotool mouseup 1; sleep 2; }
          shot() { /usr/bin/python3 -c "from PIL import ImageGrab; ImageGrab.grab().save('$RUNNER_TEMP/reference-screens/$1.png')"; }
          click 215 315; shot 20-english
          click 215 315; shot 21-next
          click 215 265; shot 22-menu
          xdotool key Escape; sleep 1; shot 23-back
          click 210 337; shot 24-practice
          click 210 265; shot 25-hill
          sleep 16; shot 26-timeout
          pkill dosbox || true
          rm -rf "$RUNNER_TEMP/dsj" "$RUNNER_TEMP/dsj.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: reference-observation-screens
          path: ${{ runner.temp }}/reference-screens/*.png
          retention-days: 1
