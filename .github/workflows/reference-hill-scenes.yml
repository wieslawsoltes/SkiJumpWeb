name: Observe original hill rendering
on:
  push:
    branches: [research/dsj210-fidelity]
    paths: [.github/workflows/reference-hill-scenes.yml]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq dosbox xvfb xdotool python3-pil
      - name: Capture original scenes without changing the executable or game data
        shell: bash
        env:
          DISPLAY: ':99'
          SDL_AUDIODRIVER: dummy
        run: |
          Xvfb :99 -screen 0 800x600x24 &
          sleep 2
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          from PIL import ImageGrab
          import os, time, subprocess as sp, urllib.request as http, hashlib, zipfile, io, json
          root=Path(os.environ['RUNNER_TEMP']); game=root/'dsj';game.mkdir()
          out=root/'reference-scenes';out.mkdir()
          data=http.urlopen('https://www.mediamond.fi/dsj2/downloads/dsj210.zip',timeout=30).read()
          assert hashlib.sha256(data).hexdigest()=='c58c4484c911e1a91b1bc62710a6a1ddc911defbe77a06c72ebec51f3c78c431'
          z=zipfile.ZipFile(io.BytesIO(data));z.extractall(game)
          example=(game/'EXAMPLE.RPL').read_bytes()
          conf=root/'reference.conf'
          conf.write_text('[sdl]\nfullscreen=false\noutput=surface\nautolock=false\n[render]\nframeskip=0\naspect=false\nscaler=normal2x\n[cpu]\ncycles=fixed 30000\n')
          def click(x,y,wait=.4):
              sp.run(['xdotool','mousemove',str(x),str(y)],check=True);time.sleep(.15)
              sp.run(['xdotool','mousedown','1'],check=True);time.sleep(.25)
              sp.run(['xdotool','mouseup','1'],check=True);time.sleep(wait)
          def launch():
              return sp.Popen(['dosbox','-conf',str(conf),'-c','mount c '+str(game),'-c','c:','-c','dsj.exe'],stdout=sp.DEVNULL,stderr=sp.DEVNULL)
          # Complete the demo's real first-run language and sound setup once.
          app=launch();time.sleep(8);click(215,315,2);click(205,426,10)
          app.terminate();app.wait(timeout=10)
          sources=[('fin','EXAMPLE.RPL'),('cze','cze-149m.rpl'),('sui','sui-193m.rpl'),('slo','slo-283m.rpl'),('bel','bel-121m.rpl'),('jpn','jpn-233m.rpl'),('svk','svk-129m.rpl'),('can','can-204m.rpl'),('ita','ita-256m.rpl'),('ger','ger-135m.rpl'),('blr','blr-260m.rpl'),('pol','pol-91m.rpl'),('hun','hun-226m.rpl'),('rus','rus-228m.rpl')]
          evidence=[]
          for hill,name in sources:
              replay=example if name=='EXAMPLE.RPL' else http.urlopen('https://www.mediamond.fi/dsj2/replays/'+name,timeout=30).read()
              for f in game.iterdir():
                  if f.suffix.lower()=='.rpl':f.unlink()
              (game/'REF.RPL').write_bytes(replay)
              app=launch();time.sleep(10)
              click(205,362,1);click(205,227,1)
              ImageGrab.grab().save(out/(hill+'-info.png'))
              click(205,365,.1)
              for i,delay in enumerate([.1,1.4,2,2,3,3]):
                  time.sleep(delay);ImageGrab.grab().save(out/(hill+'-'+str(i)+'.png'))
              app.terminate();app.wait(timeout=10)
              evidence.append({'hill':hill,'source':name,'sha256':hashlib.sha256(replay).hexdigest(),'unmodified_demo':True})
          (out/'sources.json').write_text(json.dumps(evidence,indent=2))
          PY
          rm -rf "$RUNNER_TEMP/dsj"
      - uses: actions/upload-artifact@v4
        with:
          name: original-hill-observations
          path: ${{ runner.temp }}/reference-scenes/
          retention-days: 1
