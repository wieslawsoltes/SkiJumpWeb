name: Validate and commit classic UI 0.5.0
on:
  push:
    branches: [feature/classic-ui-v050]
    paths: ['.maintenance/**', '.github/workflows/implement-v050.yml']
permissions:
  contents: write
env:
  PYTHONDONTWRITEBYTECODE: '1'
defaults:
  run:
    shell: bash
concurrency:
  group: ski-classic-ui-implementation
  cancel-in-progress: false
jobs:
  implement:
    if: github.ref == 'refs/heads/feature/classic-ui-v050'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply preimage and output verified UI implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, lzma, subprocess
          packed=b''.join(Path(f'.maintenance/ui.{i}').read_bytes() for i in range(5))
          assert hashlib.sha256(packed).hexdigest()=='a324b84eb25ad6ffd24e3a6f15fc40d4b808991467f7f2c43f9e98f99b0be47b'
          data=json.loads(lzma.decompress(packed))
          assert data['format']=='ski-ui-patch' and data['version']==1
          seen=set()
          for entry in data['files']:
              path=Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] not in {'.git','.github'}
              assert str(path) not in seen
              seen.add(str(path))
              if entry['before'] is None:
                  assert not path.exists(), f'Unexpected file: {path}'
              else:
                  assert hashlib.sha256(path.read_bytes()).hexdigest()==entry['before'], f'Source changed: {path}'
          patch=data['patch'].encode('utf-8')
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          for entry in data['files']:
              assert hashlib.sha256(Path(entry['path']).read_bytes()).hexdigest()==entry['after'], f'Output mismatch: {entry["path"]}'
          print(f'Applied {len(seen)} checksum-verified source files')
          PY
      - name: Validate engine, references, build and SDK
        run: |
          mkdir -p artifacts
          python3 -m unittest discover -s tests -p 'test_*.py'
          npm run verify 2>&1 | tee artifacts/verify.txt
          npm run pack:all 2>&1 | tee artifacts/pack.txt
          npm install --global typescript@5.9.3
          node tools/verify-packages.mjs --types 2>&1 | tee artifacts/package-install.txt
      - name: Install browser tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/ski-playwright"
          "$RUNNER_TEMP/ski-playwright/bin/pip" install playwright==1.57.0 Pillow==11.3.0
          "$RUNNER_TEMP/ski-playwright/bin/python" -m playwright install --with-deps chromium
      - name: Validate classic UI, gameplay, touch and actual WebGPU
        run: |
          PY="$RUNNER_TEMP/ski-playwright/bin/python"
          CHROMIUM="$($PY -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          export CHROMIUM
          "$PY" tests/browser_full.py 2>&1 | tee artifacts/browser-tests.txt
          "$PY" tests/browser_features.py 2>&1 | tee artifacts/browser-features.txt
          "$PY" tests/browser_fidelity.py 2>&1 | tee artifacts/browser-fidelity.txt
          "$PY" tests/browser_ui.py 2>&1 | tee artifacts/browser-ui.txt
          "$PY" tests/browser_gpu.py --require-webgpu 2>&1 | tee artifacts/browser-webgpu.txt
      - name: Require all 384 current fixtures on each renderer
        run: |
          PY="$RUNNER_TEMP/ski-playwright/bin/python"
          CHROMIUM="$($PY -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          export CHROMIUM
          rm -rf artifacts/rendering
          rm -f artifacts/browser-rendering.json
          "$PY" tests/browser_rendering.py 2>&1 | tee artifacts/browser-rendering.txt
          node tools/write-validation.mjs
      - name: Commit tested source, SDK, screenshots and distributions
        run: |
          rm .maintenance/ui.{0,1,2,3,4}
          git add -A -- app packages docs tests tools README.md CHANGELOG.md package.json artifacts dist SkiJumpWeb.html .maintenance
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: ship reusable 320x200 classic UI skin and complete menu workflows' -m 'Implement authored bitmap ink, static twin-jump backdrop, semantic forms and select popups, options tabs, compact tables, replay details and delete confirmation. Preserve enhanced mode, native editing, focus and gameplay controls. Keep touch/navigation extensions outside the native frame; reserve measured wrapped host space. Add Node, browser and external-reference acceptance tests and regenerate all ten 0.5.0 SDK packages. Original photo/glyph and complete original-screen pixel parity remain unverified.'
          git push origin HEAD:feature/classic-ui-v050
          python3 tools/package-release.py
          echo "Validated source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ski-classic-ui-validation
          if-no-files-found: error
          path: |
            release/
            artifacts/browser-*
            artifacts/verify.txt
            artifacts/package-install.txt
            artifacts/release.json
            artifacts/screenshots/
            artifacts/ui/
            artifacts/rendering/
