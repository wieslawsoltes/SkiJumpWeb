name: Validate and commit hill renderer update
on:
  push:
    branches: [feature/renderer-parity]
    paths: ['.maintenance/**', '.github/workflows/implement-v040.yml']
  workflow_dispatch:
permissions:
  contents: write
env:
  PYTHONDONTWRITEBYTECODE: '1'
defaults:
  run:
    shell: bash
concurrency:
  group: ski-renderer-implementation
  cancel-in-progress: false
jobs:
  implement:
    if: github.ref == 'refs/heads/feature/renderer-parity'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply independently tested and checksum-verified source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, lzma
          data=b''.join(Path(f'.maintenance/renderer.{i}').read_bytes() for i in range(5))
          assert hashlib.sha256(data).hexdigest()=='dc38a0f01d9acdbfeda74361a9489800682dd8805226b53f2f14b2233f43939b', 'Transfer checksum mismatch'
          manifest=json.loads(lzma.decompress(data))
          assert manifest['format']=='ski-source-update' and manifest['version']==1
          outputs=[]; seen=set(); mismatches=[]
          for entry in manifest['files']:
              path=Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] not in {'.git','.github'}, 'Unsafe source path'
              assert str(path) not in seen, 'Duplicate source path'
              seen.add(str(path))
              raw=path.read_bytes() if path.exists() else b''
              if entry['before'] is None:
                  if path.exists(): mismatches.append(str(path))
              elif hashlib.sha256(raw).hexdigest()!=entry['before']: mismatches.append(str(path))
              text=raw.decode('utf-8');cursor=0;result=[]
              for offset,length,insert in entry['edits']:
                  assert cursor<=offset<=offset+length<=len(text), f'Invalid edit: {path}'
                  result.extend([text[cursor:offset],insert]);cursor=offset+length
              result.append(text[cursor:]); output=''.join(result).encode('utf-8')
              assert hashlib.sha256(output).hexdigest()==entry['after'], f'Output checksum mismatch: {path}'
              outputs.append((path,output))
          assert not mismatches, f'Source preimages differ: {mismatches}'
          for path,output in outputs:
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(output)
          print(f'Applied {len(outputs)} verified source files')
          PY
          python3 .maintenance/refine-renderer.py
      - name: Validate engine, build and package metadata
        run: |
          mkdir -p artifacts
          python3 -m unittest discover -s tests -p 'test_*.py'
          npm run verify 2>&1 | tee artifacts/verify.txt
          npm run pack:all 2>&1 | tee artifacts/pack.txt
      - name: Validate isolated SDK installation and declarations
        run: |
          npm install --global typescript@5.9.3
          node tools/verify-packages.mjs --types 2>&1 | tee artifacts/package-install.txt
      - name: Install browser tools
        run: |
          python3 -m venv "$RUNNER_TEMP/ski-playwright"
          "$RUNNER_TEMP/ski-playwright/bin/pip" install playwright==1.57.0 Pillow==11.3.0
          "$RUNNER_TEMP/ski-playwright/bin/python" -m playwright install --with-deps chromium
      - name: Validate desktop, touch and WebGPU behavior
        run: |
          PY="$RUNNER_TEMP/ski-playwright/bin/python"
          CHROMIUM="$($PY -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          export CHROMIUM
          "$PY" tests/browser_full.py 2>&1 | tee artifacts/browser-tests.txt
          "$PY" tests/browser_features.py 2>&1 | tee artifacts/browser-features.txt
          "$PY" tests/browser_fidelity.py 2>&1 | tee artifacts/browser-fidelity.txt
          "$PY" tests/browser_gpu.py --require-webgpu 2>&1 | tee artifacts/browser-webgpu.txt
      - name: Require actual pixel comparisons on all 32 hills and all three backends
        run: |
          PY="$RUNNER_TEMP/ski-playwright/bin/python"
          CHROMIUM="$($PY -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          export CHROMIUM
          "$PY" tests/browser_rendering.py 2>&1 | tee artifacts/browser-rendering.txt
          node tools/write-validation.mjs
      - name: Commit all validated sources and regenerated distributions
        run: |
          rm .maintenance/renderer.{0,1,2,3,4} .maintenance/refine-renderer.py
          git add -A -- README.md CHANGELOG.md app packages docs package.json tools tests dist SkiJumpWeb.html artifacts .maintenance
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: implement shared classic hill rendering and all-hill pixel regressions' -m 'Ship 0.4.0 with layered inruns, continuous sidewalls, faceted supports, branch pines, perspective tracking, projected skier shadows and shared fog, dithering and replay-time snowfall. Use the same full scene on WebGPU, WebGL2 and a clipped depth-buffered software rasterizer. Validate engine, browser workflows, GPU recovery and 288 image fixtures per backend. Preserve original-fidelity provenance: four observed color families, remaining original geometry/camera/scenery and pixel equality unverified.'
          git push origin HEAD:feature/renderer-parity
          echo "Implementation commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hill-renderer-validation
          path: |
            artifacts/browser-*
            artifacts/verify.txt
            artifacts/package-install.txt
            artifacts/release.json
            artifacts/rendering/
            artifacts/screenshots/
